<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="email"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #218838; }
        .cancel { text-decoration: none; padding: 10px 15px; background: #6c757d; color: white; border-radius: 4px; margin-right: 10px; }
        .errorlist { color: red; list-style: none; padding: 0; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Add New Student</h1>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div style="margin-top: 20px;">
            <a href="{% url 'student_list' %}" class="cancel">Cancel</a>
            <button type="submit">Save Student</button>
        </div>
    </form>
</body>
</html>
